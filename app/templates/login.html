<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · TK_APS</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-bg">
<div class="login-card card">
  <div class="login-title">TK·APS</div>
  <div class="login-sub">自动化选品 + AI 视频素材生成</div>
  {% if err %}<div class="flash flash-err">{{ err }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next_url" value="{{ request.query_params.get('next', '/') }}">
    <label>账号</label>
    <input name="username" autofocus autocomplete="username" required>
    <label>密码</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary btn-block">登录</button>
  </form>
</div>
</body>
</html>
