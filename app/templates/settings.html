{% extends "base.html" %}
{% block title %}设置 · TK_APS{% endblock %}
{% block content %}

<div class="page-head">
  <h1>设置</h1>
  <form method="post" action="/settings/reload" class="inline-form">
    <button class="btn">重新加载配置</button>
  </form>
</div>

<div class="card">
  <h3>密钥状态（.env）</h3>
  <table>
    {% for k, v in env_items %}
    <tr><td><code>{{ k }}</code></td><td>{{ v }}</td></tr>
    {% endfor %}
  </table>
  <p class="muted small">密钥在 .env 文件里改，改完重启服务。</p>
</div>

<form method="post" action="/settings/save" class="card">
  <h3>config.yaml</h3>
  <p class="muted small">模型、视频规格、筛选条件都在这里。保存时会校验 YAML，新任务立即生效（正在跑的任务不受影响）。</p>
  <textarea name="config_text" class="config-editor" spellcheck="false">{{ config_text }}</textarea>
  <div class="form-bar">
    <button class="btn btn-primary" onclick="return confirm('保存并应用配置？')">保存配置</button>
  </div>
</form>

{% endblock %}
