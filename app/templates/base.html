<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TK_APS{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body {% if autoreload %}data-autoreload="1"{% endif %}>
<nav class="topnav">
  <div class="nav-inner">
    <a class="brand" href="/">TK·APS</a>
    <a href="/" class="{{ 'active' if nav == 'home' else '' }}">总览</a>
    <a href="/products" class="{{ 'active' if nav == 'products' else '' }}">选品</a>
    <a href="/scripts" class="{{ 'active' if nav == 'scripts' else '' }}">脚本</a>
    <a href="/videos" class="{{ 'active' if nav == 'videos' else '' }}">视频</a>
    <a href="/settings" class="{{ 'active' if nav == 'settings' else '' }}">设置</a>
    <span class="nav-spacer"></span>
    <span class="nav-user">{{ current_user }}</span>
    <form method="post" action="/logout" class="inline-form">
      <button class="btn btn-text">退出</button>
    </form>
  </div>
</nav>
<main class="container">
  {% if msg %}<div class="flash flash-ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="flash flash-err">{{ err }}</div>{% endif %}
  <div id="jobs-box" hidden></div>
  {% block content %}{% endblock %}
</main>
<footer class="footer">TK_APS · 自动化选品 + AI 视频素材</footer>
<script src="/static/app.js"></script>
</body>
</html>
